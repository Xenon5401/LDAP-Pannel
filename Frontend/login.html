<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — SambaLDAP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #050810;
    --surface: #0d1117;
    --surface2: #161b22;
    --border: #21262d;
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --green: #22c55e;
    --red: #ef4444;
    --text: #e6edf3;
    --muted: #8b949e;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Glow */
  body::after {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 400px;
    background: radial-gradient(ellipse, rgba(59,130,246,0.12), transparent 70%);
    pointer-events: none;
  }

  .login-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 16px;
  }

  .logo-block {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin-bottom: 16px;
    box-shadow: 0 0 30px rgba(59,130,246,0.3);
  }
  .logo-title {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .logo-title span { color: var(--accent); }
  .logo-sub {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 4px;
    font-family: var(--font-mono);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }

  .card-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 24px;
  }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.875rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }
  .field input::placeholder { color: var(--muted); }

  .btn-login {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: var(--font-display);
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    margin-top: 8px;
    letter-spacing: 0.02em;
  }
  .btn-login:hover {
    background: #2563eb;
    box-shadow: 0 0 20px rgba(59,130,246,0.4);
  }
  .btn-login:active { transform: scale(0.98); }

  .error-msg {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.2);
    color: var(--red);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.8rem;
    margin-top: 14px;
    display: none;
    font-family: var(--font-mono);
  }
  .error-msg.show { display: block; }

  .footer-note {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 20px;
    font-family: var(--font-mono);
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo-block">
    <div class="logo-icon">⬡</div>
    <div class="logo-title">Samba<span>LDAP</span></div>
    <div class="logo-sub">bts-ciel.local · 192.168.1.101</div>
  </div>

  <div class="card">
    <div class="card-title">Connexion administrateur</div>

    <div class="field">
      <label>Identifiant</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username" />
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="btn-login" onclick="doLogin()">Se connecter</button>
    <div class="error-msg" id="errMsg">Identifiants incorrects. Réessayez.</div>
  </div>

  <div class="footer-note">Session sécurisée — cookie HttpOnly</div>
</div>

<script>
  function doLogin() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;
    const err = document.getElementById('errMsg');

    if (!user || !pass) {
      err.textContent = 'Veuillez remplir tous les champs.';
      err.classList.add('show');
      return;
    }

    // TODO: replace with fetch('/api/login', { method: 'POST', ... })
    // Simulate: redirect on success
    err.classList.remove('show');

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass }),
      credentials: 'include'
    })
    .then(r => {
      if (r.ok) {
        window.location.href = 'dashboard.html';
      } else {
        err.textContent = 'Identifiants incorrects.';
        err.classList.add('show');
      }
    })
    .catch(() => {
      err.textContent = 'Erreur réseau. Vérifiez votre connexion.';
      err.classList.add('show');
    });
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
