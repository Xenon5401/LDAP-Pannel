<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Droits — SambaLDAP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #050810; --surface: #0d1117; --surface2: #161b22; --border: #21262d;
    --accent: #3b82f6; --accent2: #06b6d4; --green: #22c55e; --red: #ef4444;
    --yellow: #eab308; --text: #e6edf3; --muted: #8b949e;
    --font-display: 'Syne', sans-serif; --font-mono: 'JetBrains Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-display); min-height: 100vh; display: flex; }

  .sidebar { width: 220px; min-height: 100vh; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 16px; gap: 8px; position: fixed; top: 0; left: 0; bottom: 0; }
  .sidebar-logo { font-size: 1.1rem; font-weight: 800; padding: 8px 12px 24px; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .sidebar-logo span { color: var(--accent); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 0.875rem; font-weight: 600; transition: all 0.15s; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background-color: rgba(59,130,246,0.1); color: var(--accent); }
  .sidebar-bottom { margin-top: auto; border-top: 1px solid var(--border); padding-top: 16px; }

  .main { margin-left: 220px; flex: 1; padding: 32px; display: flex; flex-direction: column; gap: 24px; }
  .page-title { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
  .page-title span { color: var(--accent); }
  .page-sub { font-size: 0.82rem; color: var(--muted); font-family: var(--font-mono); }

  .btn { padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; font-family: var(--font-display); font-size: 0.825rem; font-weight: 700; transition: all 0.15s; display: inline-flex; align-items: center; gap: 8px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--border); }
  .btn-sm { padding: 5px 12px; font-size: 0.75rem; }
  .btn-success { background: rgba(34,197,94,0.1); color: var(--green); border: 1px solid rgba(34,197,94,0.2); }
  .btn-success:hover { background: rgba(34,197,94,0.2); }

  /* Share cards grid */
  .shares-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

  .share-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: border-color 0.2s; }
  .share-card:hover { border-color: rgba(59,130,246,0.4); }

  .share-header { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .share-name { font-weight: 800; font-size: 1rem; }
  .share-path { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); margin-top: 3px; }

  .tag { font-family: var(--font-mono); font-size: 0.68rem; padding: 3px 8px; border-radius: 999px; }
  .tag-up { background: rgba(34,197,94,0.1); color: var(--green); border: 1px solid rgba(34,197,94,0.2); }
  .tag-down { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.2); }

  .share-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }

  /* Permission rows */
  .perm-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--surface2); border-radius: 8px; border: 1px solid var(--border); }
  .perm-info { display: flex; align-items: center; gap: 10px; }
  .perm-entity { font-weight: 600; font-size: 0.85rem; }
  .perm-type { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); }
  .perm-badges { display: flex; gap: 4px; }

  .perm-badge {
    font-family: var(--font-mono); font-size: 0.65rem; padding: 3px 7px;
    border-radius: 5px; cursor: pointer; border: 1px solid transparent;
    transition: all 0.15s; user-select: none;
  }
  .perm-badge.r { background: rgba(59,130,246,0.1); color: var(--accent); border-color: rgba(59,130,246,0.2); }
  .perm-badge.r.off { background: transparent; color: var(--muted); border-color: var(--border); }
  .perm-badge.w { background: rgba(34,197,94,0.1); color: var(--green); border-color: rgba(34,197,94,0.2); }
  .perm-badge.w.off { background: transparent; color: var(--muted); border-color: var(--border); }
  .perm-badge.x { background: rgba(234,179,8,0.1); color: var(--yellow); border-color: rgba(234,179,8,0.2); }
  .perm-badge.x.off { background: transparent; color: var(--muted); border-color: var(--border); }

  .share-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; }

  /* Save banner */
  .save-banner {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--accent); border-radius: 12px;
    padding: 14px 24px; display: flex; align-items: center; gap: 16px;
    font-size: 0.875rem; font-weight: 600; z-index: 50;
    box-shadow: 0 0 30px rgba(59,130,246,0.2);
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .save-banner.show { opacity: 1; pointer-events: all; }
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-logo">Samba<span>LDAP</span></div>
  <a href="dashboard.html" class="nav-item">🗂 Dashboard</a>
  <a href="users.html" class="nav-item">👥 Utilisateurs</a>
  <a href="droits.html" class="nav-item active">🛡 Droits</a>
  <a href="mdp.html" class="nav-item">🔑 Mots de passe</a>
  <div class="sidebar-bottom">
    <a href="login.html" class="nav-item">↩ Déconnexion</a>
  </div>
</nav>

<main class="main">
  <div>
    <h1 class="page-title">Gestion des <span>Droits</span></h1>
    <p class="page-sub">Droits d'accès par partage SMB — cliquer sur R/W/X pour basculer</p>
  </div>

  <div class="shares-grid" id="sharesGrid">
    <!-- populated by JS -->
  </div>
</main>

<div class="save-banner" id="saveBanner">
  Modifications non sauvegardées
  <button class="btn btn-primary btn-sm" onclick="saveAll()">Sauvegarder</button>
  <button class="btn btn-ghost btn-sm" onclick="hideBanner()">Ignorer</button>
</div>

<script>
  const shares = [
    {
      name: 'homes', path: '/home/%U', active: true,
      perms: [
        { entity: '%U (propriétaire)', type: 'user', r: true, w: true, x: true },
        { entity: 'admin', type: 'user', r: true, w: true, x: true },
      ]
    },
    {
      name: 'HOMES_ALL', path: '/home', active: true,
      perms: [
        { entity: 'admin', type: 'user', r: true, w: true, x: true },
        { entity: 'prof', type: 'group', r: true, w: false, x: false },
      ]
    },
    {
      name: 'PUBLIC', path: '/srv/samba/public', active: true,
      perms: [
        { entity: 'prof', type: 'group', r: true, w: true, x: false },
        { entity: 'ciel1', type: 'group', r: true, w: false, x: false },
        { entity: 'ciel2', type: 'group', r: true, w: false, x: false },
      ]
    },
    {
      name: 'PROF', path: '/srv/samba/prof', active: true,
      perms: [
        { entity: 'prof', type: 'group', r: true, w: true, x: true },
        { entity: 'ciel1', type: 'group', r: false, w: false, x: false },
        { entity: 'ciel2', type: 'group', r: false, w: false, x: false },
      ]
    },
    {
      name: 'CIEL1', path: '/srv/samba/ciel1', active: false,
      perms: [
        { entity: 'ciel1', type: 'group', r: true, w: true, x: true },
        { entity: 'prof', type: 'group', r: true, w: false, x: false },
      ]
    },
    {
      name: 'CIEL2', path: '/srv/samba/ciel2', active: true,
      perms: [
        { entity: 'ciel2', type: 'group', r: true, w: true, x: true },
        { entity: 'prof', type: 'group', r: true, w: false, x: false },
      ]
    },
  ];

  let dirty = false;

  function togglePerm(shareIdx, permIdx, bit) {
    shares[shareIdx].perms[permIdx][bit] = !shares[shareIdx].perms[permIdx][bit];
    renderShares();
    dirty = true;
    document.getElementById('saveBanner').classList.add('show');
  }

  function renderShares() {
    const grid = document.getElementById('sharesGrid');
    grid.innerHTML = shares.map((s, si) => `
      <div class="share-card">
        <div class="share-header">
          <div>
            <div class="share-name">${s.name}</div>
            <div class="share-path">${s.path}</div>
          </div>
          <span class="tag ${s.active ? 'tag-up' : 'tag-down'}">${s.active ? 'ACTIF' : 'INACTIF'}</span>
        </div>
        <div class="share-body">
          ${s.perms.map((p, pi) => `
            <div class="perm-row">
              <div class="perm-info">
                <div>
                  <div class="perm-entity">${p.entity}</div>
                  <div class="perm-type">${p.type}</div>
                </div>
              </div>
              <div class="perm-badges">
                <span class="perm-badge r ${p.r ? '' : 'off'}" onclick="togglePerm(${si},${pi},'r')" title="Lecture">R</span>
                <span class="perm-badge w ${p.w ? '' : 'off'}" onclick="togglePerm(${si},${pi},'w')" title="Écriture">W</span>
                <span class="perm-badge x ${p.x ? '' : 'off'}" onclick="togglePerm(${si},${pi},'x')" title="Exécution">X</span>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="share-footer">
          <button class="btn btn-ghost btn-sm">+ Ajouter entité</button>
        </div>
      </div>
    `).join('');
  }

  renderShares();

  function saveAll() {
    // TODO: fetch('/api/shares/permissions', { method: 'POST', body: JSON.stringify(shares) })
    console.log('POST /api/shares/permissions', shares);
    hideBanner();
    alert('Droits sauvegardés (TODO: brancher API)');
  }

  function hideBanner() {
    document.getElementById('saveBanner').classList.remove('show');
    dirty = false;
  }
</script>
</body>
</html>
